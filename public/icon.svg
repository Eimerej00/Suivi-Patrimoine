<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="160">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="220">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="170" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="4" fill="none" />
  <circle cx="256" cy="256" r="140" fill="#1e293b" fill-opacity="0.5" filter="url(#glow)" />
  <!-- Growth Bars -->
  <rect x="160" y="270" width="44" height="90" rx="14" fill="url(#bar1)" />
  <rect x="234" y="210" width="44" height="150" rx="14" fill="url(#bar2)" />
  <rect x="308" y="150" width="44" height="210" rx="14" fill="url(#bar3)" />
  <!-- Star spark on peak -->
  <polygon points="330,110 334,124 348,128 334,132 330,146 326,132 312,128 326,124" fill="#fbbf24" />
  <!-- Baseline -->
  <rect x="136" y="380" width="240" height="10" rx="5" fill="#64748b" fill-opacity="0.6" />
</svg>
